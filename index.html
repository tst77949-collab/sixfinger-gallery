<style>
:root{--bg:#0A0A12;--surface:#14141f;--card:#1a1a28;--gold:#C9A227;--gold-d:#9a7b1c;--txt:#e8e6df;--mut:#9a97a3;--line:#2a2a3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--gold-d);padding:14px 18px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:1.35rem;color:var(--gold)}
h1 small{color:var(--mut);font-weight:300;font-size:.8rem;margin-right:8px}
.bar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
#q{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:.95rem}
#q:focus{outline:none;border-color:var(--gold)}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fbtn{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 16px;font-family:inherit;font-size:.85rem;cursor:pointer}
.fbtn.on,.fbtn:hover{border-color:var(--gold);color:var(--gold)}
#count{color:var(--mut);font-size:.8rem;margin:14px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card img{width:100%;height:140px;object-fit:cover;background:#000}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:.88rem;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--mut);margin-top:auto}
.badge{background:rgba(201,162,39,.15);color:var(--gold);border:1px solid var(--gold-d);border-radius:6px;padding:1px 8px;font-size:.7rem;white-space:nowrap}
.go{margin-top:4px;text-align:center;background:var(--gold);color:#111;border-radius:8px;padding:8px;text-decoration:none;font-size:.85rem;font-weight:700}
.go:hover{background:#e0b93a}
.empty{text-align:center;color:var(--mut);padding:60px 0;font-size:1rem}
</style>

const NAMES={manhwa:'مانهوا',news:'اخبار',youtube:'یوتیوب',tiktok:'تیک‌تاک'};
let sec='all',q='';
const grid=document.getElementById('grid'),count=document.getElementById('count');
document.getElementById('total').textContent=ITEMS.length+' مورد';
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 const t=q.trim().toLowerCase();
 const list=ITEMS.filter(it=>(sec==='all'||it.s===sec)&&(!t||(it.t+' '+it.src).toLowerCase().includes(t)));
 count.textContent='نمایش '+list.length+' از '+ITEMS.length+' مورد';
 if(!list.length){grid.innerHTML='<div class="empty">مطلبی یافت نشد 📭</div>';return}
 grid.innerHTML=list.map(it=>'<div class="card">'+(it.th?'<img loading="lazy" src="'+esc(it.th)+'" alt="">':'')+'<div class="body"><div class="title">'+esc(it.t)+'</div><div class="meta"><span class="badge">'+esc(NAMES[it.s]||it.s)+'</span><span>'+esc(it.src)+'</span><span>'+esc(it.d)+'</span></div><a class="go" href="'+esc(it.u)+'" target="_blank" rel="noopener">مشاهده ↗</a></div></div>').join('');
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render()});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');sec=b.dataset.s;render()});
render();
</script>
